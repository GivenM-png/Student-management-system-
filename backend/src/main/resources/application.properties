server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/studenthub?serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:studenthub_app}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.default-property-inclusion=non_null
app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
